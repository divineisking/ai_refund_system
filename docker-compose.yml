version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-refund-system
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_KEY=base64:6nZ/P/lM2a7J9cMvO/3a7m+5n6w/q9qO5P7MvM6q9aM=
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    command: /usr/local/bin/start.sh
